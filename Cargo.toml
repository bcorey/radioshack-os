[package]
name = "radioshack-os"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "radioshack-os"

[dependencies]
bevy_crt = { path = "../bevy_crt" }
bevy = {version = "0.17", default-features = false, features = [ "async_executor", "bevy_anti_alias", "bevy_asset", "bevy_audio", "bevy_camera", "bevy_color", "bevy_core_pipeline", "bevy_gizmos", "bevy_gltf", "bevy_log", "bevy_mesh", "bevy_pbr", "bevy_render", "bevy_scene", "bevy_shader", "bevy_state", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_window", "bevy_winit", "default_font", "std", "webgl2", ] }
# match version used by bevy
smol_str = "0.2.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.13.1", default-features = false, features = ["js"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level=3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "z"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
